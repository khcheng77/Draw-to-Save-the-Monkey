<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b1d14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="畫線救猴">
<title>畫線救猴</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #2b1d14;
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    color: #3b2412;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  #wrap {
    position: relative;
    width: min(100vw - 12px, (100vh - 12px) * 1.6);
    aspect-ratio: 8 / 5;
    container-type: inline-size;
  }
  #cv {
    width: 100%; height: 100%; display: block;
    border-radius: 14px; touch-action: none; cursor: crosshair;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  .screen {
    position: absolute; inset: 0; border-radius: 14px; overflow: hidden;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .screen.show { display: flex; }
  #menu { background: linear-gradient(#bfe9ff, #fff3c9 70%, #e9c48a); }
  #menu h1 {
    margin: 0; font-size: 12cqw; line-height: 1; letter-spacing: .06em;
    color: #ff7a1a; -webkit-text-stroke: .35cqw #5a2d0c; paint-order: stroke fill;
    text-shadow: 0 .7cqw 0 #5a2d0c;
  }
  #menu img { height: 30%; margin: 1cqw 0 .5cqw; filter: drop-shadow(0 6px 4px rgba(0,0,0,.25)); }
  #menu .story { font-size: 1.9cqw; margin: 0 12px 1.6cqw; font-weight: 700; color: #5a2d0c; }
  .gems {
    position: absolute; top: 1.4cqw; right: 1.6cqw;
    background: rgba(255,255,255,.85); border-radius: 999px; padding: .2em .8em;
    font-weight: 900; font-size: 2.2cqw; color: #5a2d0c;
  }
  .btns { display: flex; gap: 1.6cqw; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-weight: 800; cursor: pointer; border: 0;
    font-size: 2.6cqw; padding: .45em 1.2em; border-radius: 999px;
    background: #ffcc33; color: #4a2508; box-shadow: 0 5px 0 #b8800f;
  }
  #bMusic {
    position: absolute; left: 1.4cqw; bottom: 1.4cqw; z-index: 20;
    font-size: 2.4cqw; padding: .3em .5em; line-height: 1;
    background: rgba(255,255,255,.85); box-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8800f; }
  button.blue { background: #6cc7ff; box-shadow: 0 5px 0 #2f84b8; color: #0f3550; }
  button.pink { background: #ff9ccf; box-shadow: 0 5px 0 #c2558f; color: #5a1035; }
  button.green { background: #8ee07a; box-shadow: 0 5px 0 #4a9b38; color: #173d0f; }
  button.gray { background: #e8dccb; box-shadow: 0 5px 0 #a8977f; }
  button:disabled { background: #cfc4b4; box-shadow: 0 5px 0 #9c907e; color: #8b8070; cursor: default; transform: none; }
  .panel { background: rgba(255, 243, 201, .98); }
  .panel h2 { margin: 0 0 1.4cqw; font-size: 4.6cqw; color: #5a2d0c; }
  #grid { display: grid; grid-template-columns: repeat(10, auto); gap: 1.1cqw; margin-bottom: 2cqw; }
  #grid button { width: 7.4cqw; padding: .35em 0; font-size: 2.8cqw; position: relative; }
  #grid button .star { position: absolute; top: -.9cqw; right: -.6cqw; font-size: .6em; }

  /* 商店 / 換衣服 */
  .shopwrap { display: flex; gap: 2.4cqw; align-items: flex-start; margin-bottom: 1.8cqw; }
  .shopcol h3 { margin: 0 0 .8cqw; font-size: 2.4cqw; color: #5a2d0c; }
  .items { display: grid; grid-template-columns: repeat(4, 9.6cqw); gap: 1cqw; }
  .item {
    background: #fff; border-radius: 1.4cqw; padding: .6cqw .4cqw .8cqw; box-shadow: 0 4px 0 #d9c39a;
    display: flex; flex-direction: column; align-items: center; gap: .3cqw; font-weight: 800; font-size: 1.5cqw;
    cursor: pointer; border: .35cqw solid transparent;
  }
  .item.on { border-color: #ff7a1a; background: #fff1dc; }
  .item.locked { opacity: .45; cursor: default; }
  .item img, .item canvas { height: 6.4cqw; width: 6.4cqw; object-fit: contain; }
  .item .price { font-size: 1.4cqw; color: #8a5a00; }
  .item button { font-size: 1.4cqw; padding: .25em .7em; white-space: nowrap; box-shadow: 0 3px 0 #b8800f; }
  .item.locked button { display: none; }
  #wardPreview { display: flex; align-items: center; gap: 3cqw; margin-bottom: 1cqw; }
  #wardPreview img { height: 12cqw; animation: dance .6s ease-in-out infinite alternate; }
  #wardPreview canvas { width: 10cqw; height: 6cqw; }
  .msg { min-height: 2.4cqw; font-weight: 800; font-size: 1.8cqw; color: #c0392b; margin-bottom: .6cqw; }

  #hud {
    position: absolute; left: 0; right: 0; top: 0; padding: 8px 10px;
    display: none; align-items: center; gap: 8px; pointer-events: none;
  }
  #hud.show { display: flex; }
  #hud button { pointer-events: auto; font-size: 1.8cqw; padding: .35em .9em; }
  #hud .title {
    font-weight: 900; font-size: 2cqw; color: #4a2508;
    background: rgba(255,255,255,.75); padding: .25em .8em; border-radius: 999px; margin-right: auto;
  }
  #hint {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    background: rgba(255,255,255,.88); border-radius: 999px; padding: .3em 1em;
    font-weight: 800; font-size: 1.9cqw; color: #5a2d0c; pointer-events: none;
    display: none; white-space: nowrap;
  }
  #hint.show { display: block; }
  #result { background: rgba(43, 29, 20, .55); }
  #result .card {
    background: #fff6dc; border-radius: 22px; padding: 2cqw 3.6cqw 2.6cqw;
    box-shadow: 0 10px 0 #b8800f; max-width: 86%;
  }
  #result h2 { margin: 0 0 .4cqw; font-size: 5.6cqw; }
  #result p { margin: 0 0 1cqw; font-weight: 700; font-size: 2cqw; }
  #rGem { font-size: 3.2cqw; font-weight: 900; color: #7b3fe4; margin-bottom: 1.4cqw; }
  #rDance { height: 11cqw; display: none; margin: 0 auto .4cqw; animation: dance .45s ease-in-out infinite alternate; }
  @keyframes dance {
    0% { transform: translateY(0) rotate(-12deg) scaleX(1); }
    100% { transform: translateY(-14%) rotate(12deg) scaleX(-1); }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="hud">
    <span class="title" id="hudTitle"></span>
    <button class="gray" id="bUndo">↩ 復原</button>
    <button class="gray" id="bClear">🗑 清除</button>
    <button id="bGo">▶ 開始</button>
    <button class="gray" id="bRetry">↻ 重來</button>
    <button class="blue" id="bHome">🏠 選單</button>
  </div>
  <div id="hint"></div>
  <audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>
  <button id="bMusic" aria-label="背景音樂開關" title="背景音樂">🔊</button>

  <div class="screen show" id="menu">
    <div class="gems" id="menuGems"></div>
    <h1>畫線救猴</h1>
    <img id="menuMonkey" alt="猴子">
    <div class="story">猴子吃掉了螞蟻搬的糖果，螞蟻氣炸了！快畫線保護牠！</div>
    <div class="btns">
      <button id="bStart">開始</button>
      <button class="blue" id="bSelect">選關</button>
      <button class="pink" id="bShop">🛒 商店</button>
      <button class="green" id="bWard">👕 換衣服</button>
    </div>
  </div>

  <div class="screen panel" id="select">
    <div class="gems" data-gems></div>
    <h2>選關</h2>
    <div id="grid"></div>
    <button class="gray" data-back>返回</button>
  </div>

  <div class="screen panel" id="shop">
    <div class="gems" data-gems></div>
    <h2>🛒 商店</h2>
    <div class="msg" id="shopMsg"></div>
    <div class="shopwrap">
      <div class="shopcol"><h3>猴子的顏色</h3><div class="items" id="shopMonkey"></div></div>
      <div class="shopcol"><h3>螞蟻的顏色</h3><div class="items" id="shopAnt"></div></div>
    </div>
    <button class="gray" data-back>返回</button>
  </div>

  <div class="screen panel" id="ward">
    <div class="gems" data-gems></div>
    <h2>👕 換衣服</h2>
    <div id="wardPreview"><img id="wardMonkey" alt="猴子"><canvas id="wardAnt" width="200" height="120"></canvas></div>
    <div class="shopwrap">
      <div class="shopcol"><h3>猴子</h3><div class="items" id="wardMonkeyItems"></div></div>
      <div class="shopcol"><h3>螞蟻</h3><div class="items" id="wardAntItems"></div></div>
    </div>
    <button class="gray" data-back>返回</button>
  </div>

  <div class="screen" id="result">
    <div class="card">
      <img id="rDance" alt="跳舞的猴子">
      <h2 id="rTitle"></h2>
      <p id="rMsg"></p>
      <div id="rGem"></div>
      <div class="btns" id="rBtns"></div>
    </div>
  </div>
</div>

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const monkeyImgs = {};   // id -> canvas
const monkeyURLs = {};   // id -> dataURL
const baseImg = new Image();

function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  let h = 0, s = 0; const l = (mx + mn) / 2;
  if (mx !== mn) {
    const d = mx - mn;
    s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
    h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
  }
  return [h, s, l];
}
function hsl2rgb(h, s, l) {
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}
function makeMonkeyColors() {
  for (const c of MONKEY_COLORS) {
    const can = document.createElement('canvas');
    can.width = baseImg.width; can.height = baseImg.height;
    const g = can.getContext('2d');
    g.drawImage(baseImg, 0, 0);
    if (c.id !== 'orig') {
      const d = g.getImageData(0, 0, can.width, can.height), px = d.data;
      for (let i = 0; i < px.length; i += 4) {
        if (px[i + 3] < 10) continue;
        let [h, s, l] = rgb2hsl(px[i], px[i + 1], px[i + 2]);
        if (s < 0.33 || l < 0.12) continue;          // 臉、手、眼睛不換色
        if (c.white) { s = 0.06; l = 0.62 + l * 0.35; }
        else if (c.black) { s = 0.05; l = 0.1 + l * 0.35; }
        else { h = c.hue; s = Math.min(1, s * 1.05); l = Math.min(0.85, l + (c.light || 0)); }
        const [r, gg, b] = hsl2rgb(h, s, l);
        px[i] = r; px[i + 1] = gg; px[i + 2] = b;
      }
      g.putImageData(d, 0, 0);
    }
    monkeyImgs[c.id] = can;
    monkeyURLs[c.id] = can.toDataURL();
  }
  refreshMonkeyPictures();
}
baseImg.onload = makeMonkeyColors;
baseImg.src = MONKEY_SRC;

  return c.c;
}

// ---------- 遊戲狀態 ----------
let engine, levelIdx = 0, L, state = 'menu';
let terrainBodies = [], hazardBodies = [], spikeBodies = [], monkey, lines = [], ants = [], particles = [], notes = [];
let stroke = null, pointerPos = null, pointerBlocked = false;
let runTime = 0, endTime = 0, spawnState = [], dropState = [], loseReason = '', gemGain = 0, danceBase = null;

function makeSpike(x, y, r, isStatic) {
  const b = Bodies.circle(x, y, r, { isStatic, label: 'spike', density: 0.003, friction: 0.5, restitution: 0.2 });
  b.r = r;
  spikeBodies.push(b);
  Composite.add(engine.world, b);
  return b;
}

function buildLevel(i) {
  levelIdx = i; L = LEVELS[i];
  engine = Engine.create();
  engine.gravity.y = 1;
  engine.positionIterations = 8;
  engine.velocityIterations = 6;
  terrainBodies = []; hazardBodies = []; spikeBodies = []; lines = []; ants = []; particles = []; notes = [];
  stroke = null; danceBase = null;

  for (const t of L.terrain) {
    let b;
    if (t.kind === 'rect') {
      b = Bodies.rectangle(t.x + t.w / 2, t.y + t.h / 2, t.w, t.h, { isStatic: true, friction: 0.9 });
    } else {
      const c = Vertices.centre(t.pts);
      b = Bodies.fromVertices(c.x, c.y, [t.pts], { isStatic: true, friction: 0.9 });
      Body.setPosition(b, c);
    }
    b.label = 'terrain';
    terrainBodies.push(b);
  }
  for (const hz of L.hazards || []) {
    const b = Bodies.rectangle(hz.x + hz.w / 2, hz.y + hz.h / 2, hz.w, hz.h, { isStatic: true, isSensor: true, label: hz.type });
    b.hz = hz;
    hazardBodies.push(b);
    terrainBodies.push(Bodies.rectangle(hz.x + hz.w / 2, H + 20, hz.w, 44, { isStatic: true, label: 'floor' }));
  }
  monkey = Bodies.rectangle(L.monkey.x, L.monkey.y, 44, 56, { label: 'monkey', density: 0.002, friction: 0.8 });
  Composite.add(engine.world, [...terrainBodies, ...hazardBodies, monkey]);
  for (const s of L.spikes || []) makeSpike(s.x, s.y, s.r, true);
  Events.on(engine, 'collisionStart', onCollide);
  Events.on(engine, 'collisionActive', onCollide);

  runTime = 0; loseReason = '';
  spawnState = L.hills.map(h => ({ left: h.count, next: h.delay ?? 0.3 }));
  dropState = (L.drops || []).map(d => ({ ...d, done: false }));
  state = 'draw';
  showScreen(null);
  $('hud').classList.add('show');
  $('hudTitle').textContent = `第 ${i + 1} 關：${L.name}`;

}

function updateHud() {

// ---------- 畫線 ----------
function canvasPoint(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function insideAny(bodies, p) {
  for (const b of bodies) {
    const parts = b.parts.length > 1 ? b.parts.slice(1) : [b];
    for (const part of parts) if (Vertices.contains(part.vertices, p)) return true;
  }
  return false;
}
function isBlocked(p) {
  if (p.x < 5 || p.x > W - 5 || p.y < 5 || p.y > H - 5) return true;
  if (Math.abs(p.x - monkey.position.x) < 22 + T && Math.abs(p.y - monkey.position.y) < 28 + T) return true;
  for (const h of L.hills) if (Math.hypot(p.x - h.x, p.y - (h.y - 10)) < 34) return true;
  for (const s of spikeBodies) if (Math.hypot(p.x - s.position.x, p.y - s.position.y) < s.r + 10) return true;
  const probes = [p, { x: p.x + 5, y: p.y }, { x: p.x - 5, y: p.y }, { x: p.x, y: p.y + 5 }, { x: p.x, y: p.y - 5 }];
  for (const q of probes) {
    if (insideAny(terrainBodies, q) || insideAny(hazardBodies, q) || insideAny(lines, q)) return true;
  }
  return false;
}
function segmentBlocked(a, b) {
  const d = Math.hypot(b.x - a.x, b.y - a.y);
  const n = Math.max(1, Math.ceil(d / 3));
  for (let i = 1; i <= n; i++) {
    if (isBlocked({ x: a.x + (b.x - a.x) * i / n, y: a.y + (b.y - a.y) * i / n })) return true;
  }
  return false;
}
function finishStroke() {
  if (!stroke || stroke.length < 2) { stroke = null; return; }
  const parts = [];
  const opt = { density: 0.004, friction: 0.8, frictionStatic: 1 };
  for (let i = 0; i < stroke.length - 1; i++) {
    const a = stroke[i], b = stroke[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    if (len < 0.5) continue;
    parts.push(Bodies.rectangle((a.x + b.x) / 2, (a.y + b.y) / 2, len, T, { ...opt, angle: Math.atan2(b.y - a.y, b.x - a.x) }));
  }
  for (const p of stroke) parts.push(Bodies.circle(p.x, p.y, T / 2, opt));
  const body = Body.create({ parts, label: 'line', friction: 0.8 });
  body.localPts = stroke.map(p => ({ x: p.x - body.position.x, y: p.y - body.position.y }));
  lines.push(body);
  Composite.add(engine.world, body);
  stroke = null;
}

cv.addEventListener('pointerdown', e => {
  if (state !== 'draw') return;
  cv.setPointerCapture(e.pointerId);
  const p = canvasPoint(e);
  pointerPos = p;
  pointerBlocked = isBlocked(p);
  stroke = pointerBlocked ? null : [p];
  $('hint').classList.remove('show');
});
cv.addEventListener('pointermove', e => {
  const p = canvasPoint(e);
  pointerPos = p;
  if (state !== 'draw') return;
  if (!(e.buttons & 1) && e.pointerType === 'mouse') { pointerBlocked = isBlocked(p); return; }
  if (!e.buttons && e.pointerType !== 'mouse') return;
  if (stroke) {
    const last = stroke[stroke.length - 1];
    if (Math.hypot(p.x - last.x, p.y - last.y) < 10) return;
    if (segmentBlocked(last, p)) { pointerBlocked = true; finishStroke(); }
    else { pointerBlocked = false; stroke.push(p); }
  } else {
    pointerBlocked = isBlocked(p);
    if (!pointerBlocked) stroke = [p];
  }
});
const endPointer = () => { if (state === 'draw') finishStroke(); };
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', () => { pointerPos = null; });

// ---------- 螞蟻 ----------
function spawnAnt(h) {
  const k = ANT_KIND[h.type], fly = h.type === 'fly';
  const b = Bodies.circle(h.x + (Math.random() - .5) * 10, h.y - (fly ? 28 : 10 + k.r), k.r,
    { label: 'ant', density: k.density, friction: 0.3, frictionAir: fly ? 0.03 : 0.01, restitution: 0 });
  b.kind = h.type; b.fly = fly;
  b.seed = Math.random() * 10;
  const dir = Math.sign(monkey.position.x - h.x) || 1;
  Body.setVelocity(b, { x: dir * 2, y: fly ? -2 : -1 });
  ants.push(b);
  Composite.add(engine.world, b);
  if (h.type === 'queen') puff(h.x, h.y - 20, '#ffd84a', 16);
}
function wallAt(p) {
  for (const list of [terrainBodies, lines, spikeBodies]) {
    for (const b of list) {
      const bd = b.bounds;
      if (p.x < bd.min.x || p.x > bd.max.x || p.y < bd.min.y || p.y > bd.max.y) continue;
      const parts = b.parts.length > 1 ? b.parts.slice(1) : [b];
      for (const part of parts) if (Vertices.contains(part.vertices, p)) return true;
    }
  }
  return false;
}
function pushAnts() {
  const g = engine.gravity.y * engine.gravity.scale;
  for (const a of ants) {
    const k = ANT_KIND[a.kind];
    const dx = monkey.position.x - a.position.x, dy = monkey.position.y - a.position.y;
    const d = Math.hypot(dx, dy) || 1;
    const m = a.mass;
    if (a.fly) {
      const wob = Math.sin(runTime * 6 + a.seed) * 0.0003;
      Body.applyForce(a, a.position, { x: m * (dx / d * k.push), y: m * (dy / d * k.push - g + wob) });
    } else {
      // 前面有牆（地形或線）就往上爬
      const dir = Math.sign(dx) || 1;
      const ahead = { x: a.position.x + dir * (k.r + 3), y: a.position.y };
      const climbing = Math.abs(dx) > 20 && wallAt(ahead);
      a.climbing = climbing;
      if (climbing) {
        Body.applyForce(a, a.position, { x: m * dir * k.push * 0.6, y: -m * g * 1.7 });
      } else {
        Body.applyForce(a, a.position, { x: m * (dir * k.push), y: m * (dy / d * 0.0004 - g * 0.45) });
      }
    }
    const v = a.velocity, sp = Math.hypot(v.x, v.y);
    if (sp > k.max) Body.setVelocity(a, { x: v.x / sp * k.max, y: v.y / sp * k.max });
  }
}
function removeAnt(a, color) {
  if (a.dead) return;
  a.dead = true;
  puff(a.position.x, a.position.y, color, a.kind === 'queen' ? 20 : 8);
}
function puff(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: (Math.random() - .5) * 4, vy: (Math.random() - .8) * 4, life: 1, color });
  }
}

// ---------- 碰撞 ----------
function onCollide(ev) {
  for (const pair of ev.pairs) {
    const A = pair.bodyA.parent, B = pair.bodyB.parent;
    const has = l => A.label === l ? A : B.label === l ? B : null;
    const ant = has('ant'), mk = has('monkey'), spk = has('spike');
    const hz = has('lava') || has('water');
    if (state === 'run') {
      if (ant && mk) lose(ant.kind === 'queen' ? 'queen' : ant.kind === 'soldier' ? 'soldier' : 'bite');
      else if (mk && hz) lose(hz.label);
      else if (mk && spk) lose('spike');
    }
    if (ant && hz) removeAnt(ant, hz.label === 'lava' ? '#ff7a1a' : '#9fdcff');
  }
}

// ---------- 流程 ----------
function startRun() {
  if (state !== 'draw') return;

  monkey.hurt = 1;
  puff(monkey.position.x, monkey.position.y, reason === 'lava' ? '#ff7a1a' : reason === 'water' ? '#9fdcff' : '#ff3b3b', 14);
  updateHud();
}
function win() {
  state = 'won'; endTime = 0;
  for (const a of ants) removeAnt(a, '#ffe066');
  const first = !cleared.has(levelIdx);
  gemGain = first ? GEM_FIRST : GEM_AGAIN;
  save.gems += gemGain;

  const colors = ['#ff5a5a', '#ffcc33', '#5ad16a', '#4fa8ff', '#c56bff', '#ff8ad0'];
  for (let i = 0; i < 70; i++) {
    particles.push({ x: Math.random() * W, y: -10 - Math.random() * 120, vx: (Math.random() - .5) * 2, vy: Math.random() * 2,

$('bClear').onclick = () => { for (const b of lines) Composite.remove(engine.world, b); lines = []; };

function step() {
  const dt = STEP / 1000;
  if (state === 'run') {
    runTime += dt;
    L.hills.forEach((h, i) => {
      const s = spawnState[i];
      const gap = h.type === 'queen' ? 3 : L.interval;
      if (s.left > 0 && runTime >= s.next) { spawnAnt(h); s.left--; s.next = runTime + gap * (0.7 + Math.random() * 0.6); }
    });
    for (const d of dropState) {
      if (!d.done && runTime >= d.t) { d.done = true; makeSpike(d.x, -20, 16, false); }
    }
  }
  if (state === 'run' || state === 'lost') pushAnts();
  Engine.update(engine, STEP);
  ants = ants.filter(a => {
    const out = a.position.y > H + 60 || a.position.x < -60 || a.position.x > W + 60;
    if (a.dead || out) { Composite.remove(engine.world, a); return false; }
    return true;
  });
  spikeBodies = spikeBodies.filter(s => {
    if (s.position.y > H + 80) { Composite.remove(engine.world, s); return false; }
    return true;
  });
  if (state === 'run') {
    const m = monkey.position;
    if (m.y > H + 40 || m.x < -40 || m.x > W + 40) lose('fall');
    else if (runTime >= SURVIVE) win();
  } else {
    endTime += dt;
    if (state === 'won' && Math.random() < 0.08) {
      notes.push({ x: monkey.position.x + (Math.random() - .5) * 60, y: monkey.position.y - 40, life: 1, ch: Math.random() < .5 ? '♪' : '♫' });
    }
    if (endTime > (state === 'won' ? 2.6 : 1.1)) showResult();
  }
}

// ---------- 繪圖 ----------
function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#9fdcff'); g.addColorStop(1, '#fff4cf');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (const [x, y, s] of [[120, 70, 1], [430, 50, 1.3], [690, 90, .9]]) {
    const cx = (x + t * 6 * s) % (W + 160) - 80;
    ctx.beginPath();
    ctx.arc(cx, y, 22 * s, 0, 7); ctx.arc(cx + 26 * s, y - 10 * s, 26 * s, 0, 7); ctx.arc(cx + 54 * s, y, 20 * s, 0, 7);
    ctx.fill();
  }
}
function polyPath(verts) {
  ctx.beginPath();
  ctx.moveTo(verts[0].x, verts[0].y);
  for (let i = 1; i < verts.length; i++) ctx.lineTo(verts[i].x, verts[i].y);
  ctx.closePath();
}
function drawTerrain() {
  for (const b of terrainBodies) {
    if (b.label === 'floor') continue;
    polyPath(b.vertices);
    ctx.fillStyle = '#9a6332'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#6b3f1c'; ctx.stroke();
    const vs = b.vertices;
    let best = 0, bestY = Infinity;
    for (let i = 0; i < vs.length; i++) {
      const a = vs[i], c = vs[(i + 1) % vs.length];
      const my = (a.y + c.y) / 2;
      if (Math.abs(c.x - a.x) > 10 && my < bestY) { bestY = my; best = i; }
    }
    const a = vs[best], c = vs[(best + 1) % vs.length];
    ctx.beginPath(); ctx.moveTo(a.x, a.y + 3); ctx.lineTo(c.x, c.y + 3);
    ctx.lineWidth = 7; ctx.strokeStyle = '#5fbf4a'; ctx.lineCap = 'round'; ctx.stroke();
  }
}
function drawHazards(t) {
  for (const b of hazardBodies) {
    const { type, x, y, w, h } = b.hz;
    const lava = type === 'lava';
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    if (lava) { g.addColorStop(0, '#ffb02e'); g.addColorStop(1, '#c4210a'); }
    else { g.addColorStop(0, 'rgba(90,190,255,.9)'); g.addColorStop(1, 'rgba(20,90,190,.95)'); }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, y + h + 10);
    for (let xx = x; xx <= x + w; xx += 8) ctx.lineTo(xx, y + Math.sin(xx * 0.05 + t * (lava ? 2 : 3)) * 3);
    ctx.lineTo(x + w, y + h + 10);
    ctx.closePath(); ctx.fill();
    if (lava) {
      ctx.fillStyle = 'rgba(255,230,120,.8)';
      for (let i = 0; i < w / 40; i++) {
        const bx = x + ((i * 53 + 17) % w), ph = (t * 0.7 + i * 0.37) % 1;
        ctx.beginPath(); ctx.arc(bx, y + h * 0.8 - ph * h * 0.7, 3 + 2 * Math.sin(i + t), 0, 7); ctx.fill();
      }
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2;
      for (let i = 0; i < w / 70; i++) {
        const bx = x + 20 + i * 70 + Math.sin(t + i) * 8;
        ctx.beginPath(); ctx.moveTo(bx, y + 18); ctx.lineTo(bx + 20, y + 18); ctx.stroke();
      }
    }
  }
}
function drawSpikes() {
  for (const s of spikeBodies) {
    ctx.save();
    ctx.translate(s.position.x, s.position.y);
    ctx.rotate(s.angle);
    const r = s.r, n = 12;
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const rr = i % 2 ? r * 0.72 : r * 1.35, a = i / (n * 2) * Math.PI * 2;
      ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath();
    ctx.fillStyle = '#5b6170'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#2b2f38'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.75, 0, 7);
    ctx.fillStyle = '#8a91a3'; ctx.fill();
    ctx.beginPath(); ctx.arc(-r * 0.25, -r * 0.25, r * 0.22, 0, 7);
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill();
    ctx.restore();
  }
}
function drawDropWarnings(t) {
  if (!dropState.length || (state !== 'draw' && state !== 'run')) return;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const d of dropState) {
    if (d.done) continue;
    const soon = state === 'run' && d.t - runTime < 1.2;
    if (soon && Math.sin(t * 20) < 0) continue;
    ctx.fillStyle = soon ? '#e11' : 'rgba(200,30,30,.55)';
    ctx.beginPath(); ctx.moveTo(d.x - 10, 8); ctx.lineTo(d.x + 10, 8); ctx.lineTo(d.x, 24); ctx.closePath(); ctx.fill();
    ctx.font = '900 12px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('!', d.x, 14);
  }
  ctx.textBaseline = 'alphabetic';
}
function drawHills() {
  for (const h of L.hills) {
    const big = h.type === 'queen';
    const rw = big ? 38 : 30, rh = big ? 28 : 22;
    ctx.fillStyle = big ? '#8f5a2c' : '#b07a44';
    ctx.beginPath(); ctx.ellipse(h.x, h.y, rw, rh, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#c89260';
    for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(h.x - 20 + (i * 37 % 40), h.y - 4 - (i * 13 % 14), 2, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#2e1a0c';
    ctx.beginPath(); ctx.ellipse(h.x, h.y - rh * 0.6, big ? 10 : 7, big ? 7 : 5, 0, 0, 7); ctx.fill();
    ctx.font = '16px sans-serif'; ctx.textAlign = 'center';
    const icon = { fly: '🪽', soldier: '⚔️', queen: '👑' }[h.type];
    if (icon) ctx.fillText(icon, h.x + rw * 0.75, h.y - rh - 2);
  }
}
function drawLines() {
  const pathOf = (pts) => { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (const p of pts) ctx.lineTo(p.x, p.y); };
  const strokeIt = (pts) => {
    if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, T / 2, 0, 7); ctx.fillStyle = '#2a2f5c'; ctx.fill(); return; }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    pathOf(pts); ctx.lineWidth = T + 2; ctx.strokeStyle = '#1e2247'; ctx.stroke();
    pathOf(pts); ctx.lineWidth = T - 3; ctx.strokeStyle = '#4c5fd6'; ctx.stroke();
  };
  for (const b of lines) {
    const c = Math.cos(b.angle), s = Math.sin(b.angle);
    strokeIt(b.localPts.map(p => ({ x: b.position.x + p.x * c - p.y * s, y: b.position.y + p.x * s + p.y * c })));
  }
  if (stroke) strokeIt(stroke);
}
function drawMonkey(t) {
  const img = curMonkey();
  ctx.save();
  if (state === 'won' && danceBase) {
    const ph = t * 9;
    ctx.translate(danceBase.x + Math.sin(ph / 2) * 6, danceBase.y - Math.abs(Math.sin(ph)) * 16);
    ctx.rotate(Math.sin(ph / 2) * 0.3);
    ctx.scale(Math.sin(ph / 2) > 0 ? 1 : -1, 1 + Math.sin(ph * 2) * 0.05);
  } else {
    const shake = monkey.hurt ? Math.sin(t * 60) * 3 : 0;
    ctx.translate(monkey.position.x + shake, monkey.position.y);
    ctx.rotate(monkey.angle);
  }
  if (img) ctx.drawImage(img, -29, -32, 58, 63);
  ctx.restore();
  if (monkey.hurt) {
    ctx.font = '26px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('💢', monkey.position.x + 24, monkey.position.y - 30);
  }
}
// 畫一隻螞蟻（原點在中心，朝右）
function drawAntShape(g, a, t, alpha) {
  const k = ANT_KIND[a.kind] || ANT_KIND.walk;
  const col = antColor(a);
  g.save();
  g.scale(k.scale, k.scale);
  g.strokeStyle = '#2a0a06'; g.lineWidth = 1.3;
  const wig = Math.sin(t * 25 + a.seed) * 2;
  for (const sx of [-2, 1, 4]) {
    g.beginPath(); g.moveTo(sx, 0); g.lineTo(sx - 2 + wig, -6); g.stroke();
    g.beginPath(); g.moveTo(sx, 0); g.lineTo(sx - 2 - wig, 6); g.stroke();
  }
  if (a.fly || a.kind === 'queen') {
    const f = a.fly ? Math.abs(Math.sin(t * 40 + a.seed)) : 0.6;
    g.fillStyle = 'rgba(255,255,255,.75)';
    g.beginPath(); g.ellipse(-2, -5, 6, 3 * f + 1, -0.4, 0, 7); g.fill();
    g.beginPath(); g.ellipse(-2, 5, 6, 3 * f + 1, 0.4, 0, 7); g.fill();
  }
  g.fillStyle = col;
  g.beginPath(); g.ellipse(a.kind === 'queen' ? -7 : -6, 0, a.kind === 'queen' ? 6.5 : 5, 4, 0, 0, 7); g.fill();
  g.beginPath(); g.arc(1, 0, 2.6, 0, 7); g.fill();
  g.beginPath(); g.arc(6, 0, a.kind === 'soldier' ? 4 : 3.4, 0, 7); g.fill();
  if (a.kind === 'soldier') {   // 大牙
    g.strokeStyle = '#1a0503'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(9, -2); g.quadraticCurveTo(13, -3, 12, 0.5); g.stroke();
    g.beginPath(); g.moveTo(9, 2); g.quadraticCurveTo(13, 3, 12, -0.5); g.stroke();
  }
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(7.5, -1.5, 1.2, 0, 7); g.arc(7.5, 1.5, 1.2, 0, 7); g.fill();
  if (a.kind === 'queen') {     // 皇冠
    g.fillStyle = '#ffd23f'; g.strokeStyle = '#a77a00'; g.lineWidth = 0.6;
    g.beginPath(); g.moveTo(4, -3); g.lineTo(4, -7); g.lineTo(5.5, -5); g.lineTo(7, -8); g.lineTo(8.5, -5); g.lineTo(10, -7); g.lineTo(10, -3); g.closePath();
    g.fill(); g.stroke();
  }
  g.restore();
}
function drawAnts(t) {
  for (const a of ants) {
    const v = a.velocity;
    const ang = Math.hypot(v.x, v.y) > 0.3 ? Math.atan2(v.y, v.x) : (a.lastAng || 0);
    a.lastAng = ang;
    ctx.save();
    ctx.translate(a.position.x, a.position.y);
    ctx.rotate(ang);
    drawAntShape(ctx, a, t);
    ctx.restore();
  }
}
function drawParticles() {
  for (const p of particles) {
    p.x += p.vx; p.vy += p.confetti ? 0.04 : 0.15; p.y += p.vy; p.life -= p.confetti ? 0.008 : 0.03;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.color;
    if (p.confetti) {
      p.rot += 0.15;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-4, -2, 8, 4); ctx.restore();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0 && p.y < H + 20);
  ctx.font = '22px sans-serif'; ctx.textAlign = 'center';
  for (const n of notes) {
    n.y -= 0.8; n.life -= 0.015;
    ctx.globalAlpha = Math.max(0, n.life);
    ctx.fillStyle = '#7b3fe4';
    ctx.fillText(n.ch, n.x, n.y);
  }
  ctx.globalAlpha = 1;
  notes = notes.filter(n => n.life > 0);
}
function drawTimer() {
  if (state !== 'run' && state !== 'won' && state !== 'lost') return;
  const left = state === 'won' ? 0 : Math.max(0, SURVIVE - runTime);
  const txt = state === 'won' ? `+${gemGain} 💎` : Math.ceil(left).toString();
  ctx.font = '900 56px "PingFang TC", "Microsoft JhengHei", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 8; ctx.strokeStyle = '#4a2508';
  ctx.strokeText(txt, W / 2, 90);
  ctx.fillStyle = state === 'won' ? '#c9a0ff' : left <= 3 ? '#ff5a3c' : '#ffcc33';
  ctx.fillText(txt, W / 2, 90);
  ctx.textBaseline = 'alphabetic';
}
function drawCursor() {
  if (state !== 'draw' || !pointerPos) return;
  ctx.beginPath(); ctx.arc(pointerPos.x, pointerPos.y, 7, 0, 7);
  ctx.lineWidth = 2;
  ctx.strokeStyle = pointerBlocked ? '#e33' : 'rgba(30,34,71,.6)';
  ctx.stroke();
  if (pointerBlocked) {
    ctx.beginPath(); ctx.moveTo(pointerPos.x - 5, pointerPos.y - 5); ctx.lineTo(pointerPos.x + 5, pointerPos.y + 5); ctx.stroke();
  }
}

let acc = 0, lastT = performance.now();
function frame(now) {
  const dt = Math.min(50, now - lastT); lastT = now;
  const t = now / 1000;
  if (engine && (state === 'run' || state === 'won' || state === 'lost')) {
    acc += dt;
    while (acc >= STEP && (state === 'run' || state === 'won' || state === 'lost')) { step(); acc -= STEP; }
  } else acc = 0;

  const k = cv.width / W;
  ctx.setTransform(k, 0, 0, k, 0, 0);
  drawBackground(t);
  if (engine && ['draw', 'run', 'won', 'lost', 'result'].includes(state)) {
    drawHills(); drawTerrain(); drawSpikes(); drawLines(); drawMonkey(t); drawAnts(t); drawHazards(t);
    drawParticles(); drawDropWarnings(t); drawTimer(); drawCursor();
  }
  requestAnimationFrame(frame);
}
updateGems();
resize();
requestAnimationFrame(frame);
</script>
<script>
// ---------- 背景音樂 ----------
(() => {
  const bgm = document.getElementById('bgm'), btn = document.getElementById('bMusic');
  const KEY = 'draw-save-monkey-music';
  let on = true;
  try { on = localStorage.getItem(KEY) !== 'off'; } catch (e) {}
  bgm.volume = 0.45;
  const play = () => { if (on && !document.hidden) bgm.play().catch(() => {}); };
  const render = () => { btn.textContent = on ? '🔊' : '🔇'; };
  render();
  // 瀏覽器規定要等使用者先互動才能播放聲音
  const unlock = () => { play(); window.removeEventListener('pointerdown', unlock); window.removeEventListener('keydown', unlock); };
  window.addEventListener('pointerdown', unlock);
  window.addEventListener('keydown', unlock);
  btn.addEventListener('pointerdown', e => e.stopPropagation());
  btn.addEventListener('click', () => {
    on = !on;
    try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch (e) {}
    if (on) play(); else bgm.pause();
    render();
  });
  // 切到背景時暫停，回來再播
  document.addEventListener('visibilitychange', () => { if (document.hidden) bgm.pause(); else play(); });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
